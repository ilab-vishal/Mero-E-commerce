name: mero-ecommerce-unified
version: '3.8'

networks:
  XYZ:
    driver: bridge

volumes:
  elastic_data:
  elastic_certs:
  elastic_config:
  redis_data:


services:
  # ----------- ELASTICSEARCH -----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: mero_ecommerce_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASS:-changeme}
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      action.auto_create_index: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
      - elastic_config:/usr/share/elasticsearch/config
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/ >/dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - XYZ

  # ---------------- KIBANA -------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: mero_ecommerce_kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_SERVICEACCOUNTTOKEN: ${KIBANA_ES_TOKEN}
      ELASTICSEARCH_SSL_VERIFICATIONMODE: none
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - XYZ

  # ---------------- REDIS --------------
  redis:
    image: redis:7.2-alpine
    container_name: mero_ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - XYZ

  # --------------- APP SERVICE -----------
  app:
    build: .
    container_name: mero_ecommerce_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_INDEX_NAME: ${ES_INDEX_NAME:-products_unified}
      ES_ENHANCED_INDEX_NAME: ${ES_ENHANCED_INDEX_NAME:-product_enhanced_descriptions}
      ELASTIC_USER: ${ELASTIC_USER:-elastic}
      ELASTIC_PASS: ${ELASTIC_PASS:-changeme}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Shopify
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET}
      SHOPIFY_STORE_URL: ${SHOPIFY_STORE_URL}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-01}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN}

      # WooCommerce
      WOOCOMMERCE_STORE_URL: ${WOOCOMMERCE_STORE_URL}
      WOOCOMMERCE_API_VERSION: ${WOOCOMMERCE_API_VERSION:-wc/v3}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET}
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET}

      NGROK_URL: ${NGROK_URL}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./scripts:/app/scripts
    networks:
      - XYZ

  # --------------- NGROK SERVICE -----------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: mero_ecommerce_ngrok
    restart: unless-stopped
    command:
      - "http"
      - "app:8000"
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHENTICATION}
    depends_on:
      - app
    networks:
      - XYZ

  # --------------- DASHBOARD SERVICE -----------
  dashboard:
    build: .
    container_name: mero_ecommerce_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      API_URL: http://app:8000
      SHOPIFY_STORE_URL: ${SHOPIFY_STORE_URL}
      WOOCOMMERCE_STORE_URL: ${WOOCOMMERCE_STORE_URL}
    command: [ "/app/.venv/bin/streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0" ]
    depends_on:
      - app
    networks:
      - XYZ

  # --------------- CELERY WORKER -----------
  worker:
    build: .
    container_name: mero_ecommerce_worker
    restart: unless-stopped
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_INDEX_NAME: ${ES_INDEX_NAME:-ecommerce_unified}
      ES_ENHANCED_INDEX_NAME: ${ES_ENHANCED_INDEX_NAME:-product_enhanced_descriptions}
      ELASTIC_USER: ${ELASTIC_USER:-elastic}
      ELASTIC_PASS: ${ELASTIC_PASS:-changeme}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: [ "/app/.venv/bin/celery", "-A", "worker.celery_app", "worker", "--loglevel=info" ]
    depends_on:
      - redis
      - app
    volumes:
      - ./logs:/app/logs
    networks:
      - XYZ
