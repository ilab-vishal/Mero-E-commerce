[project]
name = "mero-ecommerce-integration"
version = "0.1.0"
description = "Mero E-commerce Integration is a FastAPI application that integrates with Shopify to fetch products and index them in Elasticsearch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "elasticsearch>=8.11.0,<9.0.0",
    "fastapi>=0.128.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
