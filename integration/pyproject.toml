[project]
name = "mero-ecommerce-integration"
version = "0.1.0"
description = "Mero E-commerce Integration Platform supporting Shopify and WooCommerce."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=8.11.0,<9.0.0",
    "fastapi>=0.128.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
    "aiofiles>=23.0.0",
    "streamlit>=1.35.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "openai>=1.12.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-elasticsearch>=0.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
